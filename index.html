<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#111827">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black">

    <link rel="manifest"
          href="manifest.json">

    <link rel="stylesheet"
          href="style.css">

    <title>Maturita v uších</title>
</head>


<body>

<header class="app-header">

    <h1>Maturita v uších</h1>

    <p>Uč se maturitu poslechem.</p>

</header>


<main>

    <section class="category">

        <h2>Český jazyk – literatura</h2>

        <div id="songs">

    <div class="song-card">

        <div class="cover">
            <span>ČESKÝ JAZYK</span>
            <strong>STŘEDOVĚK</strong>
        </div>

        <h3>Středověk</h3>

        <p class="description">
            Hus, Kosmas, legendy, kroniky a středověká literatura.
        </p>

        <audio controls preload="metadata">
            <source
                src="audio/stredovek.mp3"
                type="audio/mpeg">
            Tvůj prohlížeč nepodporuje přehrávání audia.
        </audio>

    </div>

</div>

    </section>


    <section class="category">

        <h2>Maturitní četba</h2>

        <div class="book-card">
            <h3>Proměna</h3>
            <p>Franz Kafka</p>
        </div>

        <div class="book-card">
            <h3>Smuténka</h3>
            <p>Jan Skácel</p>
        </div>

        <div class="book-card">
            <h3>Ostře sledované vlaky</h3>
            <p>Bohumil Hrabal</p>
        </div>

    </section>

</main>


<footer>

    <p>Maturita v uších</p>

</footer>


<script src="app.js"></script>


<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register(
            "./service-worker.js"
        );

    });

}

</script>

</body>

</html>
